name: Deploy to Azure Static Web Apps

# Cible : la SWA « OsmoseRH2026 » (lemon-meadow-07fadfb10) du tenant
# osmose — bascule du 21/08. L'ancienne SWA (ashy-pebble, tenant
# synapserh) n'est plus déployée : elle reste figée jusqu'à son
# décommissionnement (plan de bascule, phase 5).
# La documentation (docs/, *.md) et les scripts d'outillage
# (src/scripts/) ne sont pas servis par la SWA : inutile de consommer
# un déploiement pour eux.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "src/scripts/**"
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LEMON_MEADOW_07FADFB10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: "api"
          output_location: "build"
