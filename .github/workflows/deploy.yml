name: Deploy to Azure Static Web Apps

# Cible : la SWA « OsmoseRH2026 » (lemon-meadow-07fadfb10) du tenant
# osmose — bascule du 21/08. L'ancienne SWA (ashy-pebble, tenant
# synapserh) n'est plus déployée : elle reste figée jusqu'à son
# décommissionnement (plan de bascule, phase 5).
# La documentation (docs/, *.md) et les scripts d'outillage
# (src/scripts/) ne sont pas servis par la SWA : inutile de consommer
# un déploiement pour eux.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "src/scripts/**"
  workflow_dispatch:

# Un seul déploiement à la fois vers la SWA. Deux téléversements
# simultanés se marchent dessus : celui qui arrive pendant la bascule de
# l'autre est rejeté par « No matching Static Web App environment was
# found » (constaté le 24/08 — deux runs déclenchés sur le même commit,
# l'un vert, l'autre rouge alors que le site était bien déployé). Le run
# le plus récent gagne, les précédents sont annulés : sur une même
# branche, seul le dernier état du code mérite d'être en ligne.
concurrency:
  group: swa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LEMON_MEADOW_07FADFB10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: "api"
          output_location: "build"
