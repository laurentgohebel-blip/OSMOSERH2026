name: Tests du portail (mode démo)

# Économie de minutes Actions (dépôt privé, forfait limité) : les tests
# ne tournent que sur main et jamais pour la documentation seule.
# Lancement manuel possible depuis l'onglet Actions (workflow_dispatch).
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le portail
        run: npm run build

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      - name: Jouer les tests de bout en bout
        run: npx playwright test

      - name: Publier le rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-playwright
          path: playwright-report
          retention-days: 7
